[project]
name = "matlens"
version = "0.4.0"
description = "消防材料更換照片整理與案件管理系統"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cryptography>=50.0.1",
    "fastapi",
    "pillow",
    "python-multipart",
    "pywebview>=6.2.1",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pyinstaller>=6.22.2",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"backend/app/main.py" = ["B008"]
